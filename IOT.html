<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking Pro</title>

  <style>
    body {
      font-family: Arial;
      background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
         url("\Users\wilfr\Desktop\IOT\TOF\5.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 30px;
      backdrop-filter: blur(5px);
      padding: 10px;
    }

    .stats {
      margin-top: 10px;
      font-size: 18px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .box {
      height: 120px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
    }

    .box:hover {
      transform: scale(1.1);
    }

    .libre {
      background: #27ae60;
    }

    .occupe {
      background: #c0392b;
    }

    .status {
      font-size: 14px;
      margin-top: 5px;
    }

    .full {
      margin-top: 20px;
      font-size: 20px;
      color: #ff4d4d;
      display: none;
    }
  </style>
</head>

<body>

<h1>🚗 SMART PARKING</h1>
<div class="stats" id="stats">Chargement...</div>
<div class="full" id="full">🚫 PARKING COMPLET</div>

<div class="container">
  <div id="P1" class="box libre">P1<div class="status">...</div></div>
  <div id="P2" class="box libre">P2<div class="status">...</div></div>
  <div id="P3" class="box libre">P3<div class="status">...</div></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  var firebaseConfig = {
     apiKey: "AIzaSyDxdoT-qwl4q9e6cnt-NTd9f7UHTgkDtGo",
  authDomain: "parkingint-b3771.firebaseapp.com",
  databaseURL: "https://parkingint-b3771-default-rtdb.firebaseio.com",
  projectId: "parkingint-b3771",
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  db.ref("parking").on("value", function(snapshot) {

    let data = snapshot.val();

    let libres = 0;
    let total = 0;

    for(let p in data){
      total++;

      let etat = data[p];
      let el = document.getElementById(p);

      if(el){
        let status = el.querySelector(".status");
        status.innerHTML = etat;

        if(etat == "libre"){
          el.className = "box libre";
          libres++;
        } else {
          el.className = "box occupe";
        }
      }
    }

    document.getElementById("stats").innerHTML =
      "Places libres : " + libres + " / " + total;

    if(libres === 0){
      document.getElementById("full").style.display = "block";
    } else {
      document.getElementById("full").style.display = "none";
    }

  });
</script>

</body>
</html>
