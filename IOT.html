<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Smart Parking Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      /* CORRECTION IMAGE : simple et propre */
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("5.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
      font-size: 30px;
      background: rgba(0,0,0,0.3);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }
    .stats { font-size: 20px; margin: 15px; font-weight: bold; }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .box {
      width: 120px;
      height: 120px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
    }
    .libre { background: #27ae60; }
    .occupe { background: #c0392b; }
    .status { font-size: 14px; margin-top: 5px; text-transform: uppercase; }
    .full { margin-top: 20px; font-size: 24px; color: #ff4d4d; font-weight: bold; display: none; }
  </style>
</head>
<body>

  <h1>🚗 SMART PARKING</h1>
  <div class="stats" id="stats">Connexion à Firebase...</div>
  <div class="full" id="full">🚫 PARKING COMPLET</div>

  <div class="container">
    <div id="P1" class="box libre">P1<div class="status">...</div></div>
    <div id="P2" class="box libre">P2<div class="status">...</div></div>
    <div id="P3" class="box libre">P3<div class="status">...</div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDxdoT-qwl4q9e6cnt-NTd9f7UHTgkDtGo",
      authDomain: "parkingint-b3771.firebaseapp.com",
      databaseURL: "https://parkingint-b3771-default-rtdb.firebaseio.com",
      projectId: "parkingint-b3771"
    };

    // Initialisation
    try {
      firebase.initializeApp(firebaseConfig);
      var db = firebase.database();
      console.log("Firebase connecté !");
    } catch (e) {
      console.error("Erreur Firebase : ", e);
    }

    // Écoute des données
    db.ref("parking").on("value", function(snapshot) {
      let data = snapshot.val();
      if (!data) return;

      let libres = 0;
      let total = 3;

      for (let i = 1; i <= 3; i++) {
        let pID = "P" + i;
        let etat = data[pID] || "libre";
        let el = document.getElementById(pID);
        
        if (el) {
          let statusEl = el.querySelector(".status");
          statusEl.innerHTML = etat;

          if (etat === "libre") {
            el.className = "box libre";
            libres++;
          } else {
            el.className = "box occupe";
          }
        }
      }

      document.getElementById("stats").innerHTML = "Places disponibles : " + libres + " / " + total;
      document.getElementById("full").style.display = (libres === 0) ? "block" : "none";
    });
  </script>
</body>
</html>
